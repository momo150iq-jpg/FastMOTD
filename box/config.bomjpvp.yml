version: "1.0.10-box.4"
#Available serializers:
#LEGACY_AMPERSAND - "&c&lExample &c&9Text".
#LEGACY_SECTION - "§c§lExample §c§9Text".
#MINIMESSAGE - "<bold><red>Example</red> <blue>Text</blue></bold>". (https://webui.adventure.kyori.net/)
#GSON - "[{"text":"Example","bold":true,"color":"red"},{"text":" ","bold":true},{"text":"Text","bold":true,"color":"blue"}]". (https://minecraft.tools/en/json_text.php/)
#GSON_COLOR_DOWNSAMPLING - Same as GSON, but uses downsampling.
serializer: MINIMESSAGE
main:
  enable-updates: false
  version-name: "Homeless"
  descriptions:
    - "      <gold>☠<bold> </bold><#ff3056><bold>BOMJ<#DDDDDD>PVP</bold> <gold>☠ <bold> </bold><dark_gray>       « <gradient:#8CF65F:#47FF79>АДСКАЯ ДРА4ИЛЬНЯ</gradient> <dark_gray>»{NL}  <#ff4747><bold>НАЧНИ БОМЖОМ!</bold>        <#ff4747>☄ <#B8FA36>КАЧАUСЯ МАЧИ ЛОХОВ <#ff4747>☄"
  favicons:
    - "server-icon.png"
    - "troll2.png"
    - "troll3.png"
    - "troll4.png"
  information:
    - ""
    - "                             <red><bold>BOMJ<white>PVP</bold>  "
    - ""
    - "  <white>Проклятый сервер с бомжами где можно е6ать mамaш,  "
    - "       <white>прокачиваться и не быть чмошной обиженкой  "
    - ""
    - "                <red>telegram.me/BomjPvPtop   BomjPvP.shop  "
    - "                       <gray>о===============3"
    - ""
  #How frequently online player count will be updated (in ms)
  update-rate: 3000
  #VARIABLE - from max-count parameter
  #ADD_SOME - will add up the number from max-count parameter to current online players amount
  max-count-type: VARIABLE
  max-count: 4444
  fake-online-add-single: 0
  fake-online-add-percent: 100
  #Accepted values: from 0.0 to 1.0.
  #Keep this value as low as possible
  #Set -1 to disable PNG recompression
  png-quality: 0.0
  #Write packets outside of Netty pipeline to avoid plugins that modify packets (e.g. PacketEvents)
  direct-write: false
  log-pings: false
  log-improper-pings: false
  #Enabling this will allow non-vanilla ping packets sequence,
  #but will open your server to nullping attacks
  allow-improper-pings: false
  #Center every MOTD line (descriptions, versions, domains) by vanilla glyph widths.
  #Leading spaces of each line are dropped, padding is computed per client version.
  center: true
  #Separate MOTDs/favicons/information for different protocol versions
  #See https://wiki.vg/Protocol_version_numbers
  versions:
    #{} = disabled
    descriptions: {}
    #{} = disabled
    favicons:
      756-758:
        - "troll.png"
    #{} = disabled
    information:
      757-758:
        - "Это"
        - "<bold>лучший сервер</bold>"
        - "<gradient:green:red>сделанный когда-либо</gradient>"
        - "поверь мне"
